[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibeaudit"
version = "0.2.0"
description = "VibeAudit — security auditor for vibe-coded repos"
requires-python = ">=3.11"
dependencies = [
    # ── Engine (from vibe_check/pyproject.toml) ──
    "typer>=0.9.0",
    "rich>=13.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-dotenv>=1.0.0",
    "detect-secrets>=1.4",
    "pip-audit>=2.6",
    "bandit>=1.7",
    "semgrep>=1.50",

    # ── Backend (Phase 2) ──
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "supabase>=2.0.0",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.8.0",
    "httpx>=0.27.0",

    # ── LLM providers ──
    "google-genai>=1.0.0",
    "openai>=1.0.0",
    "anthropic>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
]

[project.scripts]
vibe-check = "vibe_check.cli:app"

[tool.setuptools.packages.find]
include = ["vibe_check*", "backend*", "github*"]
